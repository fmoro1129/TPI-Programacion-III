<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AutoRent</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="#"><img src="img/logo.png" alt="Logo AutoRent" height="30" class="me-2">AutoRent</a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto" id="nav"></ul>
      </div>
    </div>
  </nav>

  <main class="container my-4" id="app"></main>
  <div id="alertas" class="position-fixed bottom-0 end-0 p-3" style="z-index:2000"></div>

  <div class="modal fade" id="modalReserva" tabindex="-1">
    <div class="modal-dialog"><div class="modal-content">
      <div class="modal-header"><h5 class="modal-title" id="mrTitulo"></h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <label class="form-label">Fecha de inicio</label>
        <input type="date" id="mrInicio" class="form-control mb-2">
        <label class="form-label">Fecha de fin</label>
        <input type="date" id="mrFin" class="form-control mb-3">
        <div class="alert alert-info mb-0" id="mrTotal">Elegí las fechas para ver el total.</div>
      </div>
      <div class="modal-footer"><button class="btn btn-primary" id="mrConfirmar">Confirmar reserva</button></div>
    </div></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
